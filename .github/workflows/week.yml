name: Play the week
on:
  schedule:
    - cron: '0 13 * * 2,3,4,5'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Most weeks to play (it still waits for real results)'
        default: '22'
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node run-week.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEEKS: ${{ github.event.inputs.weeks || '22' }}
      - name: Keep the schedule alive
        continue-on-error: true
        run: |
          if [ -n "$(git log -1 --since='30 days ago' --format=%H)" ]; then exit 0; fi
          date -u > heartbeat.txt
          git config user.name "sharps-bot"
          git config user.email "sharps-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Keep schedule alive"
          git push
