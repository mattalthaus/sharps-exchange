name: Play the week
on:
  schedule:
    - cron: '0 13 * * 2,3,4,5'
    - cron: '0 23 * * 5'
    - cron: '0 16 * * 6,0'
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Most weeks to play (it still waits for real results)'
        default: '22'
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node run-week.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WEEKS: ${{ github.event.inputs.weeks || '22' }}
      - name: Back up the game data (encrypted)
        if: always()
        continue-on-error: true
        run: node backup.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - name: Keep the backup for 90 days
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: sharps-backup
          path: backup/*.enc
          retention-days: 90
          if-no-files-found: ignore
      - name: Keep the schedule alive
        continue-on-error: true
        run: |
          if [ -n "$(git log -1 --since='30 days ago' --format=%H)" ]; then exit 0; fi
          date -u > heartbeat.txt
          git config user.name "sharps-bot"
          git config user.email "sharps-bot@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Keep schedule alive"
          git push
